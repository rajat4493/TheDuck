<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TheDuck — Think it out</title>
    <link rel="icon" href="/duck.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to your idea</a>
    <header class="rail">
      <a href="/" class="brand"
        ><span class="duck-mark" aria-hidden="true"></span>TheDuck</a
      >
      <nav aria-label="Your workspace">
        <button id="new-idea" type="button">+ New idea</button
        ><button id="saved-packs" type="button" hidden>Saved packs</button>
      </nav>
      <div class="brand-note">
        <p>Think it out<br />with TheDuck.</p>
        <span>Clarify before you code.</span>
      </div>
    </header>
    <main>
      <aside>
        <p class="eyebrow">YOUR IDEA, TAKEN SERIOUSLY.</p>
        <ol id="progress">
          <li>My idea</li>
          <li>What you heard</li>
          <li>Shaped &amp; checked</li>
          <li>Locked &amp; ready</li>
        </ol>
      </aside>
      <section class="workspace">
        <div id="error" role="alert" hidden></div>
        <div id="app" tabindex="-1"></div>
      </section>
    </main>
    <footer>A calmer start. A brighter build.</footer>
  </body>
</html>
